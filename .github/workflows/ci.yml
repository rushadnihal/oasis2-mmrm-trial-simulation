name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  synthetic-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Install R packages
        run: Rscript -e 'install.packages(c("mmrm", "emmeans", "mice", "rbmi"))'
      - name: No participant data in tracked files
        run: make check-data
      - name: Run the pipeline on synthetic data
        run: make synth-ci
      - name: Simulation smoke test
        run: make sim-smoke
      - name: Print synthetic cross-check input
        run: |
          echo "BEGIN_CROSSCHECK_INPUT"
          cat synthetic_reports/crosscheck/mmrm_input.csv
          echo "END_CROSSCHECK_INPUT"
